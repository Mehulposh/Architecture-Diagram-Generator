version: '3.9'

services:

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build: ./server
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      MONGO_URI: mongodb://host.docker.internal:27017/architecture-diagram-generator
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: 7d
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      CLIENT_ORIGIN: http://localhost:5173
    depends_on:
      - redis

  frontend:
    build: ./client
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  mongo_data: